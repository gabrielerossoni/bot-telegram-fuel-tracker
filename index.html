<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fuel Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Loader -->
    <div id="loader" class="loader-container">
        <div class="loader-inner">
            <div class="spinner"></div>
            <p class="loader-text">Ricerca prezzi...</p>
        </div>
    </div>

    <!-- App -->
    <main class="app-layout">

        <!-- Map -->
        <section id="map-section">
            <div id="map"></div>
            <header class="glass-header">
                <div class="header-left">
                    <span class="brand-dot"></span>
                    <h1>Prezzi Vicini</h1>
                </div>
                <div class="header-right">
                    <button id="refresh-btn" class="icon-btn" title="Aggiorna">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                    </button>
                    <button id="open-settings" class="icon-btn" title="Impostazioni">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    </button>
                </div>
            </header>
        </section>

        <!-- Bottom Panel -->
        <section id="content-section">

            <!-- Stats Bar -->
            <div id="stats-bar" class="stats-bar hidden">
                <div class="stat">
                    <span class="stat-val" id="stat-min">-</span>
                    <span class="stat-label">Min</span>
                </div>
                <div class="stat">
                    <span class="stat-val" id="stat-avg">-</span>
                    <span class="stat-label">Media</span>
                </div>
                <div class="stat">
                    <span class="stat-val" id="stat-max">-</span>
                    <span class="stat-label">Max</span>
                </div>
                <div class="stat">
                    <span class="stat-val" id="stat-count">-</span>
                    <span class="stat-label">Trovati</span>
                </div>
            </div>

            <!-- Station List -->
            <div id="ranking-list" class="station-list"></div>
        </section>
    </main>

    <!-- Settings -->
    <div id="settings-panel" class="settings-overlay hidden">
        <div class="settings-content glass-card">
            <div class="settings-header">
                <h3>Impostazioni</h3>
                <button id="close-settings" class="icon-btn-sm">&times;</button>
            </div>

            <div class="setting-item">
                <label>Carburante</label>
                <select id="fuel-select">
                    <option value="Benzina">Benzina</option>
                    <option value="Gasolio">Gasolio</option>
                    <option value="GPL">GPL</option>
                    <option value="Metano">Metano</option>
                    <option value="Benzina Special">Benzina Special</option>
                    <option value="Gasolio Special">Gasolio Special</option>
                </select>
            </div>

            <div class="setting-item">
                <label>Raggio: <span id="range-val">10</span> km</label>
                <input type="range" id="range-slider" min="5" max="50" step="5" value="10">
            </div>

            <div class="setting-item">
                <label>Servizio</label>
                <div class="toggle-row">
                    <span>Self</span>
                    <label class="toggle">
                        <input type="checkbox" id="self-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>Servito</span>
                </div>
            </div>

            <button id="save-settings" class="btn-primary">Applica</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
